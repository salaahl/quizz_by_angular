<div
  [@fadeSlideInOut]
  id="categories-container"
  class="min-h-full w-fit flex flex-col justify-between md:justify-center items-center m-auto"
>
  <div class="header">
    <h1 class="text-3xl text-center uppercase text-bold mt-4">Lorem Ipsum</h1>
    <p class="text-center mt-8 underline decoration-4 decoration-[deeppink]">
      Lorem ipsum dolor sit amet consectetur adipiscing elit suscipit euismod
      consectetur adipiscing elit suscipit euismod consectetur adipiscing elit
      suscipit euismod consectetur adipiscing elit suscipit euismod
    </p>
  </div>
  <div id="categories" class="radio-toolbar mt-8 md:mt-24">
    <ul class="flex flex-col md:flex-row flex-wrap items-center justify-center">
      <li
        class="mt-2 md:mr-2"
        *ngFor="let category of categories; let i = index"
      >
        <input
          type="radio"
          name="category"
          [value]="category.technical_name"
          [checked]="
            category_selected === category.technical_name || !category_selected
          "
          (change)="category_selected = category.technical_name"
          [id]="'category-' + i"
          hidden
        />
        <label
          class="radio_label flex font-semibold rounded-full cursor-pointer"
          [for]="'category-' + i"
        >
          {{ category.name }}
        </label>
      </li>
    </ul>
  </div>
  <div class="text-center my-8 md:my-24">
    <button class="button-48 mx-auto" (click)="showCategory()">
      <span>Lancer le quizz</span>
    </button>
  </div>
</div>
