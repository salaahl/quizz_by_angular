<div id="categories-container" class="min-h-full w-full flex flex-col justify-between items-center">
  <div class="header">
    <h1 class="text-center mt-4">Lorem Ipsum</h1>
    <p class="text-center mt-8">
      Lorem ipsum dolor sit amet consectetur adipiscing elit suscipit euismod
      consectetur adipiscing elit suscipit euismod consectetur adipiscing elit
      suscipit euismod consectetur adipiscing elit suscipit euismod
    </p>
  </div>
  <div id="categories" class="radio-toolbar mt-8">
    <ul class="flex flex-col flex-wrap items-center justify-center">
      <li
        class="mt-2 md:mt-0 md:mr-2"
        *ngFor="let category of categories; let i = index"
      >
        <input
          type="radio"
          name="category"
          [value]="category.technical_name"
          [checked]="
            category_selected === category.technical_name || !category_selected
          "
          (change)="category_selected = category.technical_name"
          [id]="'category-' + i"
          hidden
        />
        <label
          class="radio_label flex text-sm font-semibold bg-gray-400 rounded-full cursor-pointer"
          [for]="'category-' + i"
        >
          {{ category.name }}
        </label>
      </li>
    </ul>
  </div>
  <div class="text-center my-8">
    <button class="button-48 mx-auto" (click)="showCategory()">
      Lancer le quizz
    </button>
  </div>
</div>
