<div [@fadeSlideInOut] id="category-container" class="page-container">
  <div class="header">
    <h1 class="text-3xl text-center uppercase font-bold">
      {{ category_name }}
    </h1>
    <p class="text-center mt-4 underline decoration-4 decoration-[deeppink]">
      <span class="bg-white pb-[5px]">
        Sélectionnez un niveau de difficulté
      </span>
    </p>
  </div>
  <div id="levels" class="radio-toolbar my-6 md:my-8">
    <ul class="flex flex-col items-center justify-center">
      @for (level of difficulty; track level) {
      <li class="max-w-full mt-4">
        <input
          type="radio"
          name="difficulty"
          [value]="level"
          [checked]="level_selected === level || !level_selected"
          (change)="level_selected = level"
          [id]="'difficulty-' + level"
          class="input"
          hidden
        />
        <label
          class="label flex font-semibold capitalize rounded-full cursor-pointer"
          [for]="'difficulty-' + level"
        >
          {{
            level === "easy"
              ? "Facile"
              : level === "medium"
              ? "Moyen"
              : "Difficile"
          }}
        </label>
      </li>
      }
    </ul>
  </div>
  <div class="text-center mb-6">
    <a
      [routerLink]="
        '/categories/' +
        category_id +
        '/' +
        category_name +
        '/' +
        level_selected
      "
      class="button-48 mx-auto"
    >
      <span>Lancer le quiz</span>
    </a>
  </div>
</div>
