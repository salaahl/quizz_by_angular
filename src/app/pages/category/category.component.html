<div [@fadeSlideInOut] id="category-container">
  <div class="header">
    <h1 class="text-3xl text-center uppercase font-bold mt-4">
      {{ category_name }}
    </h1>
    <p class="text-center mt-8 underline decoration-4 decoration-[deeppink]">
      Sélectionnez un niveau de difficulté
    </p>
  </div>
  <div id="levels" class="radio-toolbar mt-8 md:mt-16">
    <ul class="flex flex-col items-center justify-center">
      <li *ngFor="let level of difficulty" class="max-w-full mt-4">
        <input
          type="radio"
          name="difficulty"
          [value]="level"
          [checked]="level_selected === level || !level_selected"
          (change)="level_selected = level"
          [id]="'difficulty-' + level"
          class="input"
          hidden
        />
        <label
          class="label flex font-semibold capitalize rounded-full cursor-pointer"
          [for]="'difficulty-' + level"
        >
          {{ level }}
        </label>
      </li>
    </ul>
  </div>
  <div class="text-center my-8 md:my-16">
    <a
      [routerLink]="
        '/categories/' +
        category_id +
        '/' +
        category_name +
        '/' +
        level_selected
      "
      class="button-48 mx-auto"
    >
      <span>Lancer le quizz</span>
    </a>
  </div>
</div>
